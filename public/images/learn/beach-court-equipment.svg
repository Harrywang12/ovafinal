<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">The beach court</title><desc id="desc">A 16 × 8 m sand court with two 8 × 8 m halves. The net spans the 8 m width. There is no painted centre line and no attack line. Senior net: 2.43 m men / 2.24 m women. Two players on each side. Free zone: at least 3 m. FIVB sand depth: at least 40 cm.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="80" y="100" width="480" height="240" rx="0" fill="#eee0ba" stroke="white" stroke-width="2"/><line x1="320" y1="90" x2="320" y2="350" stroke="#c8102e" stroke-width="5" /><circle cx="320" cy="90" r="5" fill="#c8102e" stroke="none" stroke-width="2"/><circle cx="320" cy="350" r="5" fill="#c8102e" stroke="none" stroke-width="2"/><circle cx="176" cy="165" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="176" y="172" text-anchor="middle" fill="white" font-size="21" font-weight="600">1</text><circle cx="464" cy="275" r="19" fill="#176b50" stroke="white" stroke-width="2"/><text x="464" y="282" text-anchor="middle" fill="white" font-size="21" font-weight="600">1</text><circle cx="224" cy="275" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="224" y="282" text-anchor="middle" fill="white" font-size="21" font-weight="600">2</text><circle cx="416" cy="165" r="19" fill="#176b50" stroke="white" stroke-width="2"/><text x="416" y="172" text-anchor="middle" fill="white" font-size="21" font-weight="600">2</text><text x="320" y="58" text-anchor="middle" fill="#c8102e" font-size="19" font-weight="600">NET</text><line x1="80" y1="380" x2="560" y2="380" stroke="#5f615a" stroke-width="1" /><line x1="80" y1="375" x2="80" y2="385" stroke="#5f615a" stroke-width="2" /><line x1="560" y1="375" x2="560" y2="385" stroke="#5f615a" stroke-width="2" /><text x="320" y="406" text-anchor="middle" fill="#20231f" font-size="19" font-weight="600">16 m</text><line x1="52" y1="100" x2="52" y2="340" stroke="#5f615a" stroke-width="1" /><line x1="47" y1="100" x2="57" y2="100" stroke="#5f615a" stroke-width="2" /><line x1="47" y1="340" x2="57" y2="340" stroke="#5f615a" stroke-width="2" /><text x="40" y="226" text-anchor="end" fill="#20231f" font-size="19" font-weight="600">8 m</text></g></svg>
