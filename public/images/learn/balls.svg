<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Check the match ball</title><desc id="desc">Use balls with matching size, weight, pressure, model and colour throughout the match. Circumference: 65–67 cm. Weight: 260–280 g. Pressure: 0.30–0.325 kg/cm² (4.26–4.61 psi).</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><circle cx="320" cy="210" r="118" fill="white" stroke="#234f70" stroke-width="2"/><path d="M220 145 Q350 190 420 280 M210 250 Q310 130 420 180 M280 99 Q240 250 362 320" fill="none" stroke="#c8102e" stroke-width="6"/><text x="320" y="51" text-anchor="middle" fill="#20231f" font-size="25" font-weight="600">65–67 cm circumference</text><text x="320" y="380" text-anchor="middle" fill="#20231f" font-size="29" font-weight="600">260–280 g</text><text x="320" y="418" text-anchor="middle" fill="#5f615a" font-size="23" font-weight="600">4.26–4.61 psi</text></g></svg>
