<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Record the court change at eight</title><desc id="desc">Teaching extract: record points at change when the leading team reaches 8. Continue in the correct section of the official deciding-set sheet without resetting the score. At 8–6: change courts and preserve the 8–6 score. Play to 15, with at least a two-point lead.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="30" y="32" width="580" height="376" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="55" y="68" text-anchor="start" fill="#c8102e" font-size="17" font-weight="600">TEACHING EXTRACT</text><line x1="50" y1="85" x2="590" y2="85" stroke="#d9d6d0" stroke-width="2" /><text x="320" y="133" text-anchor="middle" fill="#c8102e" font-size="54" font-weight="600">8–6</text><text x="320" y="171" text-anchor="middle" fill="#20231f" font-size="21" font-weight="600">CHANGE COURTS</text><rect x="70" y="207" width="220" height="90" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="180" y="239" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">POINTS AT CHANGE</text><text x="180" y="278" text-anchor="middle" fill="#20231f" font-size="32" font-weight="600">8</text><line x1="308" y1="252" x2="358" y2="252" stroke="#c8102e" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(358 252) rotate(0)" fill="none" stroke="#c8102e" stroke-width="3"/><rect x="380" y="207" width="190" height="90" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="475" y="241" text-anchor="middle" fill="#20231f" font-size="18" font-weight="600">CONTINUE</text><text x="475" y="278" text-anchor="middle" fill="#20231f" font-size="30" font-weight="600">8–6</text><text x="320" y="359" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">Target 15 · win by two</text></g></svg>
