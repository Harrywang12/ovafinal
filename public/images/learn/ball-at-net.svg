<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">The legal crossing space</title><desc id="desc">Front view of the net. The ball crosses above the net and between the antennas. An antenna touch is out; external-space recovery has specific conditions under Rule 10.1.2. A ball may touch the net while crossing legally. The ball is out once it passes completely through the space under the net.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="145" y="185" width="350" height="160" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><rect x="145" y="55" width="350" height="130" rx="0" fill="#dfede6" stroke="none" stroke-width="2"/><line x1="145" y1="185" x2="495" y2="185" stroke="#234f70" stroke-width="7" /><line x1="145" y1="45" x2="145" y2="345" stroke="#c8102e" stroke-width="5" /><line x1="495" y1="45" x2="495" y2="345" stroke="#c8102e" stroke-width="5" /><text x="320" y="96" text-anchor="middle" fill="#176b50" font-size="24" font-weight="600">CROSSING SPACE</text><text x="320" y="132" text-anchor="middle" fill="#176b50" font-size="19" font-weight="600">Above net · between antennas</text><circle cx="320" cy="161" r="13" fill="#9c6810" stroke="none" stroke-width="2"/><text x="320" y="270" text-anchor="middle" fill="#234f70" font-size="25" font-weight="600">NET</text><text x="320" y="403" text-anchor="middle" fill="#c8102e" font-size="21" font-weight="600">Under-net space: no completed crossing</text><text x="80" y="214" text-anchor="middle" fill="#c8102e" font-size="20" font-weight="600">OUT</text><text x="559" y="214" text-anchor="middle" fill="#c8102e" font-size="20" font-weight="600">OUT</text></g></svg>
