<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Who communicates with whom?</title><desc id="desc">The game captain seeks a rule explanation while the ball is out of play. The coach manages lineups, substitutions and timeouts. Game captain → referee → rule explanation Coach → lineup / substitution / timeout request</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="40" y="40" width="560" height="160" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="320" y="80" text-anchor="middle" fill="#c8102e" font-size="20" font-weight="600">GAME CAPTAIN</text><text x="160" y="133" text-anchor="middle" fill="#20231f" font-size="23" font-weight="600">Rule question</text><line x1="258" y1="126" x2="368" y2="126" stroke="#c8102e" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(368 126) rotate(0)" fill="none" stroke="#c8102e" stroke-width="3"/><text x="470" y="133" text-anchor="middle" fill="#20231f" font-size="23" font-weight="600">Referee</text><text x="320" y="176" text-anchor="middle" fill="#5f615a" font-size="19" font-weight="600">While the ball is out of play</text><rect x="40" y="235" width="560" height="160" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="320" y="277" text-anchor="middle" fill="#234f70" font-size="20" font-weight="600">COACH</text><text x="320" y="326" text-anchor="middle" fill="#20231f" font-size="25" font-weight="600">Lineup · substitutions · timeouts</text><text x="320" y="369" text-anchor="middle" fill="#5f615a" font-size="19" font-weight="600">Uses the authorized request procedure</text></g></svg>
