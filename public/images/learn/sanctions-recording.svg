<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Record the sanction and context</title><desc id="desc">Teaching extract: use the W, P, E or D column, identify the participant or team, and record the set and score. The example shows a penalty to #7 of team A in set 2 at 10–8. W = warning · P = penalty · E = expulsion · D = disqualification. Penalty points must also be entered and identified in the opponent’s point record.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="30" y="32" width="580" height="376" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="55" y="68" text-anchor="start" fill="#c8102e" font-size="17" font-weight="600">TEACHING EXTRACT</text><line x1="50" y1="85" x2="590" y2="85" stroke="#d9d6d0" stroke-width="2" /><rect x="50" y="155" width="70" height="58" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="85" y="193" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">W</text><rect x="50" y="213" width="70" height="65" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="85" y="256" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600"></text><rect x="120" y="155" width="70" height="58" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="155" y="193" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">P</text><rect x="120" y="213" width="70" height="65" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="155" y="256" text-anchor="middle" fill="#c8102e" font-size="24" font-weight="600">7</text><rect x="190" y="155" width="70" height="58" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="225" y="193" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">E</text><rect x="190" y="213" width="70" height="65" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="225" y="256" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600"></text><rect x="260" y="155" width="70" height="58" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="295" y="193" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">D</text><rect x="260" y="213" width="70" height="65" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="295" y="256" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600"></text><rect x="330" y="155" width="70" height="58" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="365" y="193" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">Team</text><rect x="330" y="213" width="70" height="65" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="365" y="256" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">A</text><rect x="400" y="155" width="70" height="58" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="435" y="193" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">Set</text><rect x="400" y="213" width="70" height="65" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="435" y="256" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">2</text><rect x="470" y="155" width="116" height="58" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="528" y="193" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">Score</text><rect x="470" y="213" width="116" height="65" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="528" y="256" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">10–8</text><text x="320" y="331" text-anchor="middle" fill="#c8102e" font-size="23" font-weight="600">Example: penalty to player #7</text><text x="320" y="371" text-anchor="middle" fill="#20231f" font-size="20" font-weight="600">Record opponent’s penalty point too</text></g></svg>
