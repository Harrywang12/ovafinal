<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Record who changed and at what score</title><desc id="desc">Teaching extract: place the incoming player below the outgoing player and record the score at the change. Timeout boxes also record the score at the request. Example substitution: #7 out, #12 in at 10–8. Write the requesting team’s score first in its timeout box.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="30" y="32" width="580" height="376" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="55" y="68" text-anchor="start" fill="#c8102e" font-size="17" font-weight="600">TEACHING EXTRACT</text><line x1="50" y1="85" x2="590" y2="85" stroke="#d9d6d0" stroke-width="2" /><text x="177" y="130" text-anchor="middle" fill="#20231f" font-size="21" font-weight="600">SUBSTITUTION</text><text x="465" y="130" text-anchor="middle" fill="#20231f" font-size="21" font-weight="600">TIMEOUTS</text><rect x="72" y="155" width="210" height="80" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="177" y="185" text-anchor="middle" fill="#20231f" font-size="23" font-weight="600">Starter 7</text><text x="177" y="218" text-anchor="middle" fill="#20231f" font-size="23" font-weight="600">Substitute 12</text><text x="177" y="279" text-anchor="middle" fill="#c8102e" font-size="25" font-weight="600">Score: 10–8</text><rect x="365" y="155" width="200" height="62" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="465" y="195" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">1: 14–12</text><rect x="365" y="230" width="200" height="62" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="465" y="270" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">2: 19–20</text><text x="320" y="362" text-anchor="middle" fill="#20231f" font-size="21" font-weight="600">Record the score at each request</text></g></svg>
