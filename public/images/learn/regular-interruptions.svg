"#d9d6d0" stroke-width="2"/><circle cx="513.3333333333334" cy="141" r="23" fill="#234f70" stroke="none" stroke-width="2"/><text x="513.3333333333334" y="148" text-anchor="middle" fill="white" font-size="22" font-weight="600">3</text><text x="513.3333333333334" y="207" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">Approval</text></g></svg>
