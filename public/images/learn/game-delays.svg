<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Delay sanctions belong to the team</title><desc id="desc">Delay signals show the card against the wrist. The first team delay in the match earns a warning; subsequent delays by that team earn a penalty. Yellow at wrist: delay warning, no point. Red at wrist: delay penalty, point and service to the opponent.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="45" y="55" width="245" height="280" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><line x1="80" y1="230" x2="240" y2="230" stroke="#20231f" stroke-width="17" /><rect x="150" y="115" width="55" height="92" rx="3" fill="#f4c743" stroke="#20231f" stroke-width="2"/><line x1="157" y1="213" x2="157" y2="247" stroke="#20231f" stroke-width="5" /><text x="167" y="292" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">YELLOW AT WRIST</text><text x="167" y="376" text-anchor="middle" fill="#20231f" font-size="20" font-weight="600">Warning: no point</text><rect x="350" y="55" width="245" height="280" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><line x1="385" y1="230" x2="545" y2="230" stroke="#20231f" stroke-width="17" /><rect x="455" y="115" width="55" height="92" rx="3" fill="#c8102e" stroke="#20231f" stroke-width="2"/><line x1="462" y1="213" x2="462" y2="247" stroke="#20231f" stroke-width="5" /><text x="472" y="292" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">RED AT WRIST</text><text x="472" y="376" text-anchor="middle" fill="#c8102e" font-size="20" font-weight="600">Penalty: point + serve</text></g></svg>
