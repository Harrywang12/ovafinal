<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">A boundary line is part of the court</title><desc id="desc">Top view of the ball’s floor contact. A ball touching any part of a boundary line is in. It is out when its floor contact is completely beyond the line. IN: any contact with the line. OUT: no contact with the line or court.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="40" y="65" width="255" height="275" rx="8" fill="#234f70" stroke="#d9d6d0" stroke-width="2"/><rect x="170" y="65" width="125" height="275" rx="0" fill="#f8f6f2" stroke="none" stroke-width="2"/><rect x="160" y="65" width="10" height="275" rx="0" fill="white" stroke="none" stroke-width="2"/><circle cx="166" cy="210" r="26" fill="#f1ce6e" stroke="#20231f" stroke-width="2"/><text x="168" y="386" text-anchor="middle" fill="#176b50" font-size="30" font-weight="600">IN</text><rect x="345" y="65" width="255" height="275" rx="8" fill="#234f70" stroke="#d9d6d0" stroke-width="2"/><rect x="475" y="65" width="125" height="275" rx="0" fill="#f8f6f2" stroke="none" stroke-width="2"/><rect x="465" y="65" width="10" height="275" rx="0" fill="white" stroke="none" stroke-width="2"/><circle cx="521" cy="210" r="26" fill="#f1ce6e" stroke="#20231f" stroke-width="2"/><text x="473" y="386" text-anchor="middle" fill="#c8102e" font-size="30" font-weight="600">OUT</text></g></svg>
