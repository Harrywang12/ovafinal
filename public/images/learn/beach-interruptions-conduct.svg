<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Beach interruption checklist</title><desc id="desc">Beach has one timeout per team per set and no substitutions. Apply the official misconduct scale and the appropriate court-switch schedule. One timeout → 30 seconds → resume play Switch every 7 combined points, or every 5 in the deciding set.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="40" y="100" width="173.33333333333334" height="232" rx="10" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="126.66666666666667" cy="141" r="23" fill="#c8102e" stroke="none" stroke-width="2"/><text x="126.66666666666667" y="148" text-anchor="middle" fill="white" font-size="22" font-weight="600">1</text><text x="126.66666666666667" y="207" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">One timeout</text><line x1="215.33333333333334" y1="245" x2="230.33333333333334" y2="245" stroke="#20231f" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(230.33333333333334 245) rotate(0)" fill="none" stroke="#20231f" stroke-width="3"/><rect x="233.33333333333334" y="100" width="173.33333333333334" height="232" rx="10" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="320" cy="141" r="23" fill="#234f70" stroke="none" stroke-width="2"/><text x="320" y="148" text-anchor="middle" fill="white" font-size="22" font-weight="600">2</text><text x="320" y="207" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">30 seconds</text><line x1="408.6666666666667" y1="245" x2="423.6666666666667" y2="245" stroke="#20231f" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(423.6666666666667 245) rotate(0)" fill="none" stroke="#20231f" stroke-width="3"/><rect x="426.6666666666667" y="100" width="173.33333333333334" height="232" rx="10" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="513.3333333333334" cy="141" r="23" fill="#234f70" stroke="none" stroke-width="2"/><text x="513.3333333333334" y="148" text-anchor="middle" fill="white" font-size="22" font-weight="600">3</text><text x="513.3333333333334" y="207" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">Resume play</text></g></svg>
