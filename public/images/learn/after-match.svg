<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Close and verify the sheet</title><desc id="desc">Teaching extract: complete set results and duration, verify match totals, then obtain the required signatures in the prescribed order. Results → totals → verification → signatures. Check the winning team and final set count against the completed set records.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="30" y="32" width="580" height="376" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="55" y="68" text-anchor="start" fill="#c8102e" font-size="17" font-weight="600">TEACHING EXTRACT</text><line x1="50" y1="85" x2="590" y2="85" stroke="#d9d6d0" stroke-width="2" /><text x="320" y="129" text-anchor="middle" fill="#c8102e" font-size="29" font-weight="600">RESULT: A wins 2–0</text><text x="100" y="183" text-anchor="start" fill="#5f615a" font-size="23" font-weight="600">Set 1</text><text x="500" y="183" text-anchor="middle" fill="#20231f" font-size="26" font-weight="600">25–18</text><text x="100" y="228" text-anchor="start" fill="#5f615a" font-size="23" font-weight="600">Set 2</text><text x="500" y="228" text-anchor="middle" fill="#20231f" font-size="26" font-weight="600">25–21</text><line x1="65" y1="254" x2="575" y2="254" stroke="#d9d6d0" stroke-width="2" /><text x="320" y="291" text-anchor="middle" fill="#20231f" font-size="23" font-weight="600">Totals → verify → signatures</text><line x1="75" y1="357" x2="270" y2="357" stroke="#5f615a" stroke-width="1" /><line x1="370" y1="357" x2="565" y2="357" stroke="#5f615a" stroke-width="1" /><text x="172" y="386" text-anchor="middle" fill="#20231f" font-size="18" font-weight="600">Captains</text><text x="468" y="386" text-anchor="middle" fill="#20231f" font-size="18" font-weight="600">Officials</text></g></svg>
