<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Tripleball and the next serve</title><desc id="desc">Team A serves this sequence: a served rally, a free ball to B, then a free ball to A. Service passes to the other team after the sequence. A designated setter may originate from position 1, 2 or 3; declare that position for the set. Substitutions occur between sequences, not between their individual rallies.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="40" y="100" width="173.33333333333334" height="232" rx="10" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="126.66666666666667" cy="141" r="23" fill="#c8102e" stroke="none" stroke-width="2"/><text x="126.66666666666667" y="148" text-anchor="middle" fill="white" font-size="22" font-weight="600">1</text><text x="126.66666666666667" y="207" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">A serves to B</text><text x="126.66666666666667" y="282" text-anchor="middle" fill="#5f615a" font-size="18" font-weight="600">Rally 1</text><line x1="215.33333333333334" y1="245" x2="230.33333333333334" y2="245" stroke="#20231f" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(230.33333333333334 245) rotate(0)" fill="none" stroke="#20231f" stroke-width="3"/><rect x="233.33333333333334" y="100" width="173.33333333333334" height="232" rx="10" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="320" cy="141" r="23" fill="#234f70" stroke="none" stroke-width="2"/><text x="320" y="148" text-anchor="middle" fill="white" font-size="22" font-weight="600">2</text><text x="320" y="207" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">Free ball to B</text><text x="320" y="282" text-anchor="middle" fill="#5f615a" font-size="18" font-weight="600">Rally 2</text><line x1="408.6666666666667" y1="245" x2="423.6666666666667" y2="245" stroke="#20231f" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(423.6666666666667 245) rotate(0)" fill="none" stroke="#20231f" stroke-width="3"/><rect x="426.6666666666667" y="100" width="173.33333333333334" height="232" rx="10" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="513.3333333333334" cy="141" r="23" fill="#234f70" stroke="none" stroke-width="2"/><text x="513.3333333333334" y="148" text-anchor="middle" fill="white" font-size="22" font-weight="600">3</text><text x="513.3333333333334" y="207" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">Free ball to A</text><text x="513.3333333333334" y="282" text-anchor="middle" fill="#5f615a" font-size="18" font-weight="600">Rally 3</text><text x="320" y="391" text-anchor="middle" fill="#c8102e" font-size="21" font-weight="600">Finish the sequence before rotating / changing</text></g></svg>
