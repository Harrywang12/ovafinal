<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Feet at the centre line</title><desc id="desc">A foot may enter the opponent’s court if some part remains on or directly above the centre line and the player does not interfere. A foot completely beyond the line is a fault. Green: foot still overlaps the centre line. Red: foot entirely across. Touching the net between antennas during the action of playing the ball is a separate fault.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="40" y="60" width="255" height="280" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><rect x="40" y="60" width="255" height="140" rx="0" fill="#f5d8dd" stroke="none" stroke-width="2"/><line x1="40" y1="200" x2="295" y2="200" stroke="#20231f" stroke-width="4" /><rect x="149" y="165" width="38" height="100" rx="17" fill="#176b50" stroke="white" stroke-width="2"/><text x="167" y="92" text-anchor="middle" fill="#20231f" font-size="20" font-weight="600">Opponent</text><text x="167" y="310" text-anchor="middle" fill="#20231f" font-size="20" font-weight="600">Own court</text><text x="167" y="386" text-anchor="middle" fill="#176b50" font-size="19" font-weight="600">Touches line: permitted</text><rect x="345" y="60" width="255" height="280" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><rect x="345" y="60" width="255" height="140" rx="0" fill="#f5d8dd" stroke="none" stroke-width="2"/><line x1="345" y1="200" x2="600" y2="200" stroke="#20231f" stroke-width="4" /><rect x="454" y="110" width="38" height="78" rx="17" fill="#c8102e" stroke="white" stroke-width="2"/><text x="472" y="92" text-anchor="middle" fill="#20231f" font-size="20" font-weight="600">Opponent</text><text x="472" y="310" text-anchor="middle" fill="#20231f" font-size="20" font-weight="600">Own court</text><text x="472" y="386" text-anchor="middle" fill="#c8102e" font-size="19" font-weight="600">Entire foot over: fault</text></g></svg>
