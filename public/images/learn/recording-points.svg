<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Follow one service turn</title><desc id="desc">Teaching extract: slash points as earned, tick the service box when a player serves, and write that team’s running total when the service turn ends. Example: team A starts at 3, scores twice, then loses service at 5. The service-turn exit score is 5; it is not the number of points earned on that turn.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="30" y="32" width="580" height="376" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="55" y="68" text-anchor="start" fill="#c8102e" font-size="17" font-weight="600">TEACHING EXTRACT</text><line x1="50" y1="85" x2="590" y2="85" stroke="#d9d6d0" stroke-width="2" /><text x="320" y="130" text-anchor="middle" fill="#20231f" font-size="25" font-weight="600">A: 3–3 → 4–3 → 5–3 → 5–4</text><rect x="65" y="172" width="75" height="60" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="102" y="212" text-anchor="middle" fill="#20231f" font-size="25" font-weight="600">1</text><line x1="81" y1="224" x2="123" y2="180" stroke="#c8102e" stroke-width="3" /><rect x="152" y="172" width="75" height="60" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="189" y="212" text-anchor="middle" fill="#20231f" font-size="25" font-weight="600">2</text><line x1="168" y1="224" x2="210" y2="180" stroke="#c8102e" stroke-width="3" /><rect x="239" y="172" width="75" height="60" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="276" y="212" text-anchor="middle" fill="#20231f" font-size="25" font-weight="600">3</text><line x1="255" y1="224" x2="297" y2="180" stroke="#c8102e" stroke-width="3" /><rect x="326" y="172" width="75" height="60" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="363" y="212" text-anchor="middle" fill="#20231f" font-size="25" font-weight="600">4</text><line x1="342" y1="224" x2="384" y2="180" stroke="#c8102e" stroke-width="3" /><rect x="413" y="172" width="75" height="60" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="450" y="212" text-anchor="middle" fill="#20231f" font-size="25" font-weight="600">5</text><line x1="429" y1="224" x2="471" y2="180" stroke="#c8102e" stroke-width="3" /><rect x="500" y="172" width="75" height="60" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="537" y="212" text-anchor="middle" fill="#20231f" font-size="25" font-weight="600">6</text><text x="67" y="286" text-anchor="start" fill="#5f615a" font-size="20" font-weight="600">Service starts</text><text x="405" y="286" text-anchor="start" fill="#5f615a" font-size="20" font-weight="600">Service lost</text><text x="150" y="341" text-anchor="middle" fill="#176b50" font-size="40" font-weight="600">✓</text><line x1="235" y1="328" x2="385" y2="328" stroke="#c8102e" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(385 328) rotate(0)" fill="none" stroke="#c8102e" stroke-width="3"/><rect x="424" y="307" width="90" height="56" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="469" y="345" text-anchor="middle" fill="#20231f" font-size="30" font-weight="600">5</text><text x="320" y="391" text-anchor="middle" fill="#20231f" font-size="19" font-weight="600">Exit score = team A’s running total</text></g></svg>
