<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">A smaller court for four</title><desc id="desc">OVA course baseline: 14 × 7 m court, divided into 7 × 7 m halves. Four players per team; no libero. Player dots are an illustrative formation, not numbered indoor positions. Net: 2.15 m girls / 2.20 m boys and co-ed. Use the course’s specified development ball and seasonal competition rules.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="80" y="100" width="480" height="240" rx="0" fill="#234f70" stroke="white" stroke-width="2"/><line x1="320" y1="90" x2="320" y2="350" stroke="#c8102e" stroke-width="5" /><circle cx="320" cy="90" r="5" fill="#c8102e" stroke="none" stroke-width="2"/><circle cx="320" cy="350" r="5" fill="#c8102e" stroke="none" stroke-width="2"/><circle cx="142" cy="220" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="142" y="227" text-anchor="middle" fill="white" font-size="21" font-weight="600">•</text><circle cx="498" cy="220" r="19" fill="#176b50" stroke="white" stroke-width="2"/><text x="498" y="227" text-anchor="middle" fill="white" font-size="21" font-weight="600">•</text><circle cx="204" cy="155" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="204" y="162" text-anchor="middle" fill="white" font-size="21" font-weight="600">•</text><circle cx="436" cy="285" r="19" fill="#176b50" stroke="white" stroke-width="2"/><text x="436" y="292" text-anchor="middle" fill="white" font-size="21" font-weight="600">•</text><circle cx="264" cy="220" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="264" y="227" text-anchor="middle" fill="white" font-size="21" font-weight="600">•</text><circle cx="376" cy="220" r="19" fill="#176b50" stroke="white" stroke-width="2"/><text x="376" y="227" text-anchor="middle" fill="white" font-size="21" font-weight="600">•</text><circle cx="204" cy="28