<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Full court, six players</title><desc id="desc">OVA 6v6 Rallyball uses an 18 × 9 m court. The front row is 4–3–2 and the back row is 5–6–1 from each team’s own perspective facing the net. Net: 2.15 m female / 2.20 m male under this course. Six players per side. No libero.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="80" y="100" width="480" height="240" rx="0" fill="#234f70" stroke="white" stroke-width="2"/><line x1="240" y1="100" x2="240" y2="340" stroke="white" stroke-width="2" /><line x1="400" y1="100" x2="400" y2="340" stroke="white" stroke-width="2" /><line x1="320" y1="90" x2="320" y2="350" stroke="#c8102e" stroke-width="5" /><circle cx="320" cy="90" r="5" fill="#c8102e" stroke="none" stroke-width="2"/><circle cx="320" cy="350" r="5" fill="#c8102e" stroke="none" stroke-width="2"/><circle cx="280" cy="145" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="280" y="152" text-anchor="middle" fill="white" font-size="21" font-weight="600">4</text><circle cx="280" cy="220" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="280" y="227" text-anchor="middle" fill="white" font-size="21" font-weight="600">3</text><circle cx="280" cy="295" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="280" y="302" text-anchor="middle" fill="white" font-size="21" font-weight="600">2</text><circle cx="160" cy="145" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="160" y="152" text-anchor="middle" fill="white" font-size="21" font-weight="600">5</text><circle cx="160" cy="220" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="160" y="227" text-anchor="middle" fill="white" font-size="21" font-weight="600">6</text><circle cx="160" cy="295" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="160" y="302" text-anchor="mi