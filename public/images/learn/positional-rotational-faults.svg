<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Overlap and wrong server are different</title><desc id="desc">Compare feet at service contact: back-row player 6 may be level with or behind front-row player 3. The last floor contact determines an airborne player’s position. The required lateral order also allows level feet under the course’s VC positioning rules. After the service hit, changing places alone is legal; allow the rally to continue. A rotational fault means the wrong player served; check the recorded service order.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><text x="320" y="28" text-anchor="middle" fill="#5f615a" font-size="18" font-weight="600">At service contact · feet viewed from above</text><rect x="20" y="48" width="190" height="305" rx="8" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><line x1="35" y1="83" x2="195" y2="83" stroke="#c8102e" stroke-width="4" /><text x="115" y="73" text-anchor="middle" fill="#c8102e" font-size="18" font-weight="600">NET</text><line x1="40" y1="175" x2="190" y2="175" stroke="#5f615a" stroke-width="1" stroke-dasharray="5 4"/><circle cx="77" cy="145" r="19" fill="#234f70" stroke="white" stroke-width="2"/><text x="77" y="152" text-anchor="middle" fill="white" font-size="21" font-weight="600">3</text><rect x="65" y="175" width="10" height="24" rx="4" fill="#234f70" stroke="white" stroke-width="2"/><rect x="79" y="175" width="10" height="24" rx="4" fill="#234f70" stroke="white" stroke-width="2"/><circle cx="152" cy="245" r="19" fill="#176b50" stroke="white" stroke-width="2"/><text x="152" y="252" text-anchor="middle" fill="white" font-size="21" font-weight="600">6</text><rect x="140" y="275" width="10" height="24" rx="4" fill="#176b50" stroke="white" stroke-width="2"/><rect x="154" y="275" width="10" height="24" rx="4" fill="#176b50" stroke="white" stroke-width="2"/><text x="115" 