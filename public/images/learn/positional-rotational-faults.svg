<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Overlap and wrong server are different</title><desc id="desc">In this simplified foot-order example, back-row player 6 must be level with or behind front-row player 3 at service contact. Lateral relationships must also be maintained under the course’s VC positioning rules. Compare feet at the service hit, rather than a player’s torso. A rotational fault means the wrong player served; check the recorded service order.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="35" y="48" width="265" height="305" rx="8" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><line x1="50" y1="83" x2="285" y2="83" stroke="#c8102e" stroke-width="4" /><text x="167" y="73" text-anchor="middle" fill="#c8102e" font-size="18" font-weight="600">NET</text><circle cx="167" cy="175" r="19" fill="#234f70" stroke="white" stroke-width="2"/><text x="167" y="182" text-anchor="middle" fill="white" font-size="21" font-weight="600">3</text><circle cx="167" cy="285" r="19" fill="#176b50" stroke="white" stroke-width="2"/><text x="167" y="292" text-anchor="middle" fill="white" font-size="21" font-weight="600">6</text><text x="167" y="386" text-anchor="middle" fill="#176b50" font-size="19" font-weight="600">LEGAL: 6 behind 3</text><rect x="340" y="48" width="265" height="305" rx="8" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><line x1="355" y1="83" x2="590" y2="83" stroke="#c8102e" stroke-width="4" /><text x="472" y="73" text-anchor="middle" fill="#c8102e" font-size="18" font-weight="600">NET</text><circle cx="472" cy="175" r="19" fill="#234f70" stroke="white" stroke-width="2"/><text x="472" y="182" text-anchor="middle" fill="white" font-size="21" font-weight="600">3</text><circle cx="472" cy="128" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="472" y="135" text-anchor="middle" fill="white" font-size="21" font-weight="600">6</text><text x="472" y="386" text-anchor="middle" fill="#c8102e" font-size="19" font-weight="600">FAULT: 6 ahead of 3</text></g></svg>
