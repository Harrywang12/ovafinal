<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">One team, two players</title><desc id="desc">Beach teams contain exactly two players, numbered 1 and 2. One is designated captain. There are no player substitutions. Players normally compete barefoot. The captain may request clarification while the ball is out of play.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><path d="M205 95 L235 95 L265 120 L248 147 L240 137 V237 H180 V137 L172 147 L155 120 Z" fill="#c8102e"/><text x="210" y="180" text-anchor="middle" fill="white" font-size="40" font-weight="600">1</text><path d="M420 95 L450 95 L480 120 L463 147 L455 137 V237 H395 V137 L387 147 L370 120 Z" fill="#c8102e"/><text x="425" y="180" text-anchor="middle" fill="white" font-size="40" font-weight="600">2</text><text x="210" y="287" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">Captain</text><text x="425" y="287" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">Teammate</text><text x="320" y="349" text-anchor="middle" fill="#20231f" font-size="25" font-weight="600">2 players · no substitutions</text><text x="320" y="392" text-anchor="middle" fill="#5f615a" font-size="20" font-weight="600">Jersey numbers 1 and 2</text></g></svg>
