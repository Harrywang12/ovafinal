<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Service sight line and free attack positions</title><desc id="desc">Top view. The server is behind the end line and the partner must not screen the receiver’s view of the server and ball flight. The net position shown is not a centre line on the sand. Both players may attack from anywhere; there are no positional-order faults. Maintain service order. Blocking an opponent’s service is forbidden.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="160" y="50" width="320" height="320" rx="0" fill="#eee0ba" stroke="white" stroke-width="2"/><rect x="160" y="375" width="320" height="45" rx="0" fill="#e0ede6" stroke="none" stroke-width="2"/><line x1="160" y1="50" x2="480" y2="50" stroke="#c8102e" stroke-width="4" /><line x1="160" y1="375" x2="160" y2="420" stroke="#176b50" stroke-width="2" stroke-dasharray="7 7"/><line x1="480" y1="375" x2="480" y2="420" stroke="#176b50" stroke-width="2" stroke-dasharray="7 7"/><circle cx="420" cy="400" r="19" fill="#176b50" stroke="white" stroke-width="2"/><text x="420" y="407" text-anchor="middle" fill="white" font-size="21" font-weight="600">S</text><line x1="420" y1="375" x2="420" y2="100" stroke="#176b50" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(420 100) rotate(-90)" fill="none" stroke="#176b50" stroke-width="3"/><text x="320" y="434" text-anchor="middle" fill="#176b50" font-size="19" font-weight="600">SERVICE ZONE</text><text x="320" y="350" text-anchor="middle" fill="#20231f" font-size="20" font-weight="600">END LINE</text><text x="320" y="28" text-anchor="middle" fill="#c8102e" font-size="19" font-weight="600">NET</text><circle cx="230" cy="170" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="230" y="177" text-anchor="middle" fill="white" font-size="21" font-weight="600">P</text></g></svg>
