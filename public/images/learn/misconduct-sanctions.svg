<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Read the cards correctly</title><desc id="desc">Card arrangement changes the consequence. Yellow is a formal warning. Red is a penalty. Joint red/yellow means expulsion; separated red/yellow means disqualification. Penalty: point and service to opponent. Expulsion: rest of the set. Disqualification: rest of the match. Serious misconduct can enter the scale directly.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="22" y="18" width="286" height="194" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><rect x="140" y="38" width="50" height="75" rx="3" fill="#f4c743" stroke="#20231f" stroke-width="2"/><text x="165" y="150" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">Warning</text><text x="165" y="187" text-anchor="middle" fill="#5f615a" font-size="20" font-weight="600">No point</text><rect x="332" y="18" width="286" height="194" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><rect x="450" y="38" width="50" height="75" rx="3" fill="#c8102e" stroke="#20231f" stroke-width="2"/><text x="475" y="150" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">Penalty</text><text x="475" y="187" text-anchor="middle" fill="#5f615a" font-size="20" font-weight="600">Point + service</text><rect x="22" y="228" width="286" height="194" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><rect x="126" y="248" width="50" height="75" rx="3" fill="#f4c743" stroke="#20231f" stroke-width="2"/><rect x="154" y="248" width="50" height="75" rx="3" fill="#c8102e" stroke="#20231f" stroke-width="2"/><text x="165" y="360" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">Expulsion</text><text x="165" y="397" text-anchor="middle" fill="#5f615a" font-size="20" font-weight="600">Rest of set</text><rect x="332" y="228" width="286" height="194" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><rect x="405" y="248" width="50" height="75" rx="3" fill="#f4c743" stroke="#20231f" stroke-width="2"/><rect x="495" y="248" width="50" height="75" rx="3" fill="#c8102e" stroke="#20231f" stroke-width="2"/><text x="475" y="360" text-anchor="middle" fill="#20231f" font-size="22" font-weight="600">Disqualification</text><text x="475" y="397" text-anchor="middle" fill="#5f615a" font-size="20" font-weight="600">Rest of match</text></g></svg>
