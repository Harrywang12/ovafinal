<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Common referee hand signals</title><desc id="desc">Schematic gestures for six common signals. Direction and motion matter; consult the rulebook’s complete official signal sequence and diagrams for match practice. Timeout: T with hands. Substitution: circular forearms. Rotation fault: circular forefinger. Ball in: point down. Ball out: forearms vertical, palms inward. End of set: crossed forearms.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="20" y="12" width="192" height="194" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="118" cy="54" r="13" fill="#20231f" stroke="none" stroke-width="2"/><line x1="118" y1="72" x2="118" y2="121" stroke="#20231f" stroke-width="10" /><line x1="118" y1="120" x2="101" y2="155" stroke="#20231f" stroke-width="7" /><line x1="118" y1="120" x2="135" y2="155" stroke="#20231f" stroke-width="7" /><path d="M118 80 L150 80 L150 42 M118 80 L98 64 L128 36 L173 36" fill="none" stroke="#20231f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="174" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">Timeout: T hands</text><rect x="224" y="12" width="192" height="194" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="322" cy="54" r="13" fill="#20231f" stroke="none" stroke-width="2"/><line x1="322" y1="72" x2="322" y2="121" stroke="#20231f" stroke-width="10" /><line x1="322" y1="120" x2="305" y2="155" stroke="#20231f" stroke-width="7" /><line x1="322" y1="120" x2="339" y2="155" stroke="#20231f" stroke-width="7" /><path d="M320 80 L290 94 L290 68 M324 80 L354 94 L354 68" fill="none" stroke="#20231f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M370 55 a17 17 0 1 1 -22 -12" fill="none" stroke="#c8102e" stroke-width="3"/><line x1="348" y1="43" x2="356" y2="42" stroke="#c8102e" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(356 42) rotate(-7.125016348901798)" fill="none" stroke="#c8102e" stroke-width="3"/><text x="320" y="174" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">Substitution</text><rect x="428" y="12" width="192" height="194" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="526" cy="54" r="13" fill="#20231f" stroke="none" stroke-width="2"/><line x1="526" y1="72" x2="526" y2="121" stroke="#20231f" stroke-width="10" /><line x1="526" y1="120" x2="509" y2="155" stroke="#20231f" stroke-width="7" /><line x1="526" y1="120" x2="543" y2="155" stroke="#20231f" stroke-width="7" /><path d="M526 80 L556 80 L556 46" fill="none" stroke="#20231f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M574 55 a17 17 0 1 1 -22 -12" fill="none" stroke="#c8102e" stroke-width="3"/><line x1="552" y1="43" x2="560" y2="42" stroke="#c8102e" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(560 42) rotate(-7.125016348901798)" fill="none" stroke="#c8102e" stroke-width="3"/><text x="524" y="174" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">Rotation fault</text><rect x="20" y="222" width="192" height="194" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="118" cy="264" r="13" fill="#20231f" stroke="none" stroke-width="2"/><line x1="118" y1="282" x2="118" y2="331" stroke="#20231f" stroke-width="10" /><line x1="118" y1="330" x2="101" y2="365" stroke="#20231f" stroke-width="7" /><line x1="118" y1="330" x2="135" y2="365" stroke="#20231f" stroke-width="7" /><path d="M118 290 L150 330" fill="none" stroke="#20231f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="384" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">Ball in: point</text><text x="116" y="408" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">down</text><rect x="224" y="222" width="192" height="194" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="322" cy="264" r="13" fill="#20231f" stroke="none" stroke-width="2"/><line x1="322" y1="282" x2="322" y2="331" stroke="#20231f" stroke-width="10" /><line x1="322" y1="330" x2="305" y2="365" stroke="#20231f" stroke-width="7" /><line x1="322" y1="330" x2="339" y2="365" stroke="#20231f" stroke-width="7" /><path d="M322 290 L290 290 L290 252 M322 290 L354 290 L354 252" fill="none" stroke="#20231f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="384" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">Ball out: palms in</text><rect x="428" y="222" width="192" height="194" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="526" cy="264" r="13" fill="#20231f" stroke="none" stroke-width="2"/><line x1="526" y1="282" x2="526" y2="331" stroke="#20231f" stroke-width="10" /><line x1="526" y1="330" x2="509" y2="365" stroke="#20231f" stroke-width="7" /><line x1="526" y1="330" x2="543" y2="365" stroke="#20231f" stroke-width="7" /><path d="M490 274 L556 313 M562 274 L496 313" fill="none" stroke="#20231f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="524" y="384" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">End of set / match</text></g></svg>
