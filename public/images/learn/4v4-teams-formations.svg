<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Diamond and square formations</title><desc id="desc">Two possible four-player shapes, each facing the net at the top. F and B identify front-row and back-row roles; the designated setter must be in the front row. Diamond: one front, two side, one back. Square: two front, two back. Illustrative spacing only; all players participate and rotate roles.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="35" y="65" width="265" height="265" rx="0" fill="#234f70" stroke="white" stroke-width="2"/><line x1="35" y1="65" x2="300" y2="65" stroke="#c8102e" stroke-width="4" /><text x="167" y="42" text-anchor="middle" fill="#c8102e" font-size="18" font-weight="600">NET</text><circle cx="167" cy="115" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="167" y="122" text-anchor="middle" fill="white" font-size="21" font-weight="600">F</text><circle cx="100" cy="200" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="100" y="207" text-anchor="middle" fill="white" font-size="21" font-weight="600">B</text><circle cx="235" cy="200" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="235" y="207" text-anchor="middle" fill="white" font-size="21" font-weight="600">B</text><circle cx="167" cy="285" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="167" y="292" text-anchor="middle" fill="white" font-size="21" font-weight="600">B</text><text x="167" y="386" text-anchor="middle" fill="#20231f" font-size="26" font-weight="600">Diamond</text><rect x="340" y="65" width="265" height="265" rx="0" fill="#234f70" stroke="white" stroke-width="2"/><line x1="340" y1="65" x2="605" y2="65" stroke="#c8102e" stroke-width="4" /><text x="472" y="42" text-anchor="middle" fill="#c8102e" font-size="18" font-weight="600">NET</text><circle cx="415" cy="135" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="415" y="142" text-anchor="middle" fill="white" font-size="21" font-weight="600">F</text><circle cx="530" cy="135" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="530" y="142" text-anchor="middle" fill="white" font-size="21" font-weight="600">F</text><circle cx="415" cy="270" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="415" y="277" text-anchor="middle" fill="white" font-size="21" font-weight="600">B</text><circle cx="530" cy="270" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="530" y="277" text-anchor="middle" fill="white" font-size="21" font-weight="600">B</text><text x="472" y="386" text-anchor="middle" fill="#20231f" font-size="26" font-weight="600">Square</text></g></svg>
