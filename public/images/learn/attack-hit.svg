<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Back-row takeoff and landing</title><desc id="desc">Side view. For a back-row attack on a ball entirely above net height, take off without touching or crossing the attack line. Landing in the front zone is permitted. The takeoff, not the landing, determines this restriction. A back-row player cannot complete a front-zone attack on a ball entirely above the net.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><line x1="55" y1="340" x2="590" y2="340" stroke="#20231f" stroke-width="3" /><line x1="355" y1="95" x2="355" y2="340" stroke="#c8102e" stroke-width="4" /><line x1="535" y1="95" x2="535" y2="340" stroke="#234f70" stroke-width="5" /><line x1="355" y1="175" x2="535" y2="175" stroke="#5f615a" stroke-width="2" stroke-dasharray="7 7"/><text x="355" y="69" text-anchor="middle" fill="#c8102e" font-size="21" font-weight="600">Attack line</text><text x="535" y="69" text-anchor="middle" fill="#234f70" font-size="21" font-weight="600">Net</text><circle cx="210" cy="310" r="19" fill="#176b50" stroke="white" stroke-width="2"/><text x="210" y="317" text-anchor="middle" fill="white" font-size="21" font-weight="600">B</text><circle cx="430" cy="310" r="19" fill="#176b50" stroke="white" stroke-width="2"/><text x="430" y="317" text-anchor="middle" fill="white" font-size="21" font-weight="600">B</text><path d="M210 280 Q270 105 430 280" fill="none" stroke="#176b50" stroke-width="3" stroke-dasharray="8 6"/><circle cx="315" cy="155" r="12" fill="#9c6810" stroke="none" stroke-width="2"/><line x1="330" y1="150" x2="575" y2="150" stroke="#c8102e" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(575 150) rotate(0)" fill="none" stroke="#c8102e" stroke-width="3"/><line x1="355" y1="378" x2="535" y2="378" stroke="#5f615a" stroke-width="1" /><line x1="355" y1="373" x2="355" y2="383" stroke="#5f615a" stroke-width="2" /><line x1="535" y1="373" x2="535" y2="383" stroke="#5f615a" stroke-width="2" /><text x="445" y="404" text-anchor="middle" fill="#20231f" font-size="19" font-weight="600">3 m</text><text x="167" y="391" text-anchor="middle" fill="#176b50" font-size="22" font-weight="600">Takeoff</text><text x="440" y="365" text-anchor="middle" fill="#176b50" font-size="20" font-weight="600">Landing</text></g></svg>
