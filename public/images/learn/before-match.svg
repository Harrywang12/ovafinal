<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Prepare the match record</title><desc id="desc">Teaching extract: verify match identity, player roster, captain designation and approvals before play. Use the official form for the complete required fields. Check event, date, venue, teams, player numbers and officials. Follow the VC-specific libero recording instructions for the competition.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="30" y="32" width="580" height="376" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="55" y="68" text-anchor="start" fill="#c8102e" font-size="17" font-weight="600">TEACHING EXTRACT</text><line x1="50" y1="85" x2="590" y2="85" stroke="#d9d6d0" stroke-width="2" /><text x="56" y="125" text-anchor="start" fill="#5f615a" font-size="18" font-weight="600">MATCH</text><text x="56" y="152" text-anchor="start" fill="#20231f" font-size="22" font-weight="600">Event · date · venue</text><line x1="55" y1="167" x2="585" y2="167" stroke="#d9d6d0" stroke-width="1" /><text x="56" y="197" text-anchor="start" fill="#5f615a" font-size="18" font-weight="600">TEAMS</text><text x="56" y="224" text-anchor="start" fill="#20231f" font-size="22" font-weight="600">Team A / Team B</text><line x1="55" y1="239" x2="585" y2="239" stroke="#d9d6d0" stroke-width="1" /><text x="56" y="269" text-anchor="start" fill="#5f615a" font-size="18" font-weight="600">ROSTER</text><text x="56" y="296" text-anchor="start" fill="#20231f" font-size="22" font-weight="600">Numbers · captain · libero</text><line x1="55" y1="311" x2="585" y2="311" stroke="#d9d6d0" stroke-width="1" /><text x="56" y="341" text-anchor="start" fill="#5f615a" font-size="18" font-weight="600">APPROVAL</text><text x="56" y="368" text-anchor="start" fill="#20231f" font-size="22" font-weight="600">Officials · signatures</text><line x1="55" y1="383" x2="585" y2="383" stroke="#d9d6d0" stroke-width="1" /></g></svg>
