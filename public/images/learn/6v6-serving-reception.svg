<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Keep the reception configuration</title><desc id="desc">A neutral six-player reception example, facing the net. Position numbers describe rotational order. A designated setter is a separately declared role and is not permanently attached to one universal court position. Use the same reception configuration for the whole set under this OVA course. Do not switch until the ball returns to your side; overhand serve reception is a fault.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="140" y="55" width="360" height="360" rx="0" fill="#234f70" stroke="white" stroke-width="2"/><line x1="140" y1="175" x2="500" y2="175" stroke="white" stroke-width="2" /><line x1="130" y1="55" x2="510" y2="55" stroke="#c8102e" stroke-width="5" /><text x="320" y="33" text-anchor="middle" fill="#c8102e" font-size="19" font-weight="600">NET</text><circle cx="180" cy="135" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="180" y="142" text-anchor="middle" fill="white" font-size="21" font-weight="600">4</text><circle cx="320" cy="135" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="320" y="142" text-anchor="middle" fill="white" font-size="21" font-weight="600">3</text><circle cx="460" cy="135" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="460" y="142" text-anchor="middle" fill="white" font-size="21" font-weight="600">2</text><circle cx="180" cy="295" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="180" y="302" text-anchor="middle" fill="white" font-size="21" font-weight="600">5</text><circle cx="320" cy="295" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="320" y="302" text-anchor="middle" fill="white" font-size="21" font-weight="600">6</text><circle cx="460" cy="295" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text 