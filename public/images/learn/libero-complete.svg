<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">The libero’s replacement path</title><desc id="desc">The libero replaces a back-row player through the bench-side zone between the attack line and end line. Only one libero may be on court. Unlimited replacements, separate from substitutions; normally a completed rally between replacements. An overhand finger set by the libero in the front zone restricts a teammate’s above-net attack.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="140" y="55" width="360" height="360" rx="0" fill="#234f70" stroke="white" stroke-width="2"/><line x1="140" y1="175" x2="500" y2="175" stroke="white" stroke-width="2" /><line x1="130" y1="55" x2="510" y2="55" stroke="#c8102e" stroke-width="5" /><text x="320" y="33" text-anchor="middle" fill="#c8102e" font-size="19" font-weight="600">NET</text><rect x="505" y="175" width="38" height="240" rx="0" fill="#f0deb8" stroke="none" stroke-width="2"/><line x1="565" y1="305" x2="475" y2="305" stroke="#9c6810" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(475 305) rotate(180)" fill="none" stroke="#9c6810" stroke-width="3"/><line x1="475" y1="360" x2="565" y2="360" stroke="#9c6810" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(565 360) rotate(0)" fill="none" stroke="#9c6810" stroke-width="3"/><circle cx="180" cy="135" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="180" y="142" text-anchor="middle" fill="white" font-size="21" font-weight="600">4</text><circle cx="320" cy="135" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="320" y="142" text-anchor="middle" fill="white" font-size="21" font-weight="600">3</text><circle cx="460" cy="135" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="460" y="142" text-anchor="middle" fill="white" font-size="21" font-weight="600">2</text><circle cx="180" cy="295" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="180" y="302" text-anchor="middle" fill="white" font-size="21" font-weight="600">5</text><circle cx="320" cy="295" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="320" y="302" text-anchor="middle" fill="white" font-size="21" font-weight="600">6</text><circle cx="460" cy="295" r="19" fill="#9c6810" stroke="white" stroke-width="2"/><text x="460" y="302" text-anchor="middle" fill="white" font-size="21" font-weight="600">L</text><text x="320" y="225" text-anchor="middle" fill="white" font-size="20" font-weight="600">BACK ROW</text><text x="320" y="390" text-anchor="middle" fill="white" font-size="18" font-weight="600">Replacement zone →</text></g></svg>
