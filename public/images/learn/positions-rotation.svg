<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Positions and clockwise rotation</title><desc id="desc">One team, facing the net at the top. Arrows show the next position when the team gains the right to serve. Numbers are rotational positions, not jersey numbers or fixed tactical roles. Rotation: 1 → 6 → 5 → 4 → 3 → 2 → 1. Position 1 is back-right and supplies the server.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="140" y="55" width="360" height="360" rx="0" fill="#234f70" stroke="white" stroke-width="2"/><line x1="140" y1="175" x2="500" y2="175" stroke="white" stroke-width="2" /><line x1="130" y1="55" x2="510" y2="55" stroke="#c8102e" stroke-width="5" /><text x="320" y="33" text-anchor="middle" fill="#c8102e" font-size="19" font-weight="600">NET</text><line x1="432" y1="295" x2="348" y2="295" stroke="#f6c867" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(348 295) rotate(180)" fill="none" stroke="#f6c867" stroke-width="3"/><line x1="292" y1="295" x2="208" y2="295" stroke="#f6c867" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(208 295) rotate(180)" fill="none" stroke="#f6c867" stroke-width="3"/><line x1="180" y1="267" x2="180" y2="163" stroke="#f6c867" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(180 163) rotate(-90)" fill="none" stroke="#f6c867" stroke-width="3"/><line x1="208" y1="135" x2="292" y2="135" stroke="#f6c867" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(292 135) rotate(0)" fill="none" stroke="#f6c867" stroke-width="3"/><line x1="348" y1="135" x2="432" y2="135" stroke="#f6c867" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(432 135) rotate(0)" fill="none" stroke="#f6c867" stroke-width="3"/><line x1="460" y1="163" x2="460" y2="267" stroke="#f6c867" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(460 267) rotate(90)" fill="none" stroke="#f6c867" stroke-width="3"/><circle cx="180" cy="135" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="180" y="142" text-anchor="middle" fill="white" font-size="21" font-weight="600">4</text><circle cx="320" cy="135" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="320" y="142" text-anchor="middle" fill="white" font-size="21" font-weight="600">3</text><circle cx="460" cy="135" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="460" y="142" text-anchor="middle" fill="white" font-size="21" font-weight="600">2</text><circle cx="180" cy="295" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="180" y="302" text-anchor="middle" fill="white" font-size="21" font-weight="600">5</text><circle cx="320" cy="295" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="320" y="302" text-anchor="middle" fill="white" font-size="21" font-weight="600">6</text><circle cx="460" cy="295" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="460" y="302" text-anchor="middle" fill="white" font-size="21" font-weight="600">1</text></g></svg>
