<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Officials around the court</title><desc id="desc">Top view with a two-line-judge arrangement. R1 and R2 stand at opposite net posts. The scorer’s table sits outside the free zone, behind R2. R1: elevated stand, overall match authority. R2: floor level, requests and bench control. Line judges cover diagonally opposite corners; a four-judge system uses one near each corner.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="80" y="100" width="480" height="240" rx="0" fill="#234f70" stroke="white" stroke-width="2"/><line x1="240" y1="100" x2="240" y2="340" stroke="white" stroke-width="2" /><line x1="400" y1="100" x2="400" y2="340" stroke="white" stroke-width="2" /><line x1="320" y1="90" x2="320" y2="350" stroke="#c8102e" stroke-width="5" /><circle cx="320" cy="90" r="5" fill="#c8102e" stroke="none" stroke-width="2"/><circle cx="320" cy="350" r="5" fill="#c8102e" stroke="none" stroke-width="2"/><circle cx="320" cy="55" r="19" fill="#20231f" stroke="white" stroke-width="2"/><text x="320" y="62" text-anchor="middle" fill="white" font-size="21" font-weight="600">R1</text><circle cx="320" cy="374" r="19" fill="#20231f" stroke="white" stroke-width="2"/><text x="320" y="381" text-anchor="middle" fill="white" font-size="21" font-weight="600">R2</text><rect x="242" y="400" width="156" height="36" rx="6" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="320" y="425" text-anchor="middle" fill="#20231f" font-size="19" font-weight="600">Scorer</text><circle cx="58" cy="85" r="19" fill="#176b50" stroke="white" stroke-width="2"/><text x="58" y="92" text-anchor="middle" fill="white" font-size="21" font-weight="600">LJ</text><circle cx="582" cy="355" r="19" fill="#176b50" stroke="white" stroke-width="2"/><text x="582" y="362" text-anchor="middle" fill="white" font-size="21" font-weight="600">LJ</text><text x="167" y="60" text-anchor="middle" fill="#20231f" font-size="20" font-weight="600">R1 on stand</text><text x="170" y="399" text-anchor="middle" fill="#20231f" font-size="19" font-weight="600">R2 at floor level</text></g></svg>
