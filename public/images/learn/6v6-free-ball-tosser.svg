<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">One consistent free-ball target</title><desc id="desc">Half-court top view. The tosser introduces the ball to their own team, consistently toward position 5 or 6. The front row starts at the net, ready for the cue. Two-hand underhand toss, above antenna height, with little or no spin. Choose a consistent target; the illustration shows alternatives, not two simultaneous tosses.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="140" y="55" width="360" height="360" rx="0" fill="#234f70" stroke="white" stroke-width="2"/><line x1="140" y1="175" x2="500" y2="175" stroke="white" stroke-width="2" /><line x1="130" y1="55" x2="510" y2="55" stroke="#c8102e" stroke-width="5" /><text x="320" y="33" text-anchor="middle" fill="#c8102e" font-size="19" font-weight="600">NET</text><line x1="70" y1="230" x2="155" y2="292" stroke="#9c6810" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(155 292) rotate(36.10745129175187)" fill="none" stroke="#9c6810" stroke-width="3"/><line x1="70" y1="230" x2="300" y2="292" stroke="#9c6810" stroke-width="3" stroke-dasharray="8 6"/><path d="M-10 -5 L0 0 L-10 5" transform="translate(300 292) rotate(15.08635400846512)" fill="none" stroke="#9c6810" stroke-width="3"/><circle cx="65" cy="200" r="19" fill="#9c6810" stroke="white" stroke-width="2"/><text x="65" y="207" text-anchor="middle" fill="white" font-size="21" font-weight="600">T</text><circle cx="180" cy="135" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="180" y="142" text-anchor="middle" fill="white" font-size="21" font-weight="600">4</text><circle cx="320" cy="135" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="320" y="142" text-anchor="middle" fill="white" font-size="21" font-weight="600">3</text><circle cx="460" cy="135" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="460" y="142" text-anchor="middle" fill="white" font-size="21" font-weight="600">2</text><circle cx="180" cy="295" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="180" y="302" text-anchor="middle" fill="white" font-size="21" font-weight="600">5</text><circle cx="320" cy="295" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="320" y="302" text-anchor="middle" fill="white" font-size="21" font-weight="600">6</text><circle cx="460" cy="295" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="460" y="302" text-anchor="middle" fill="white" font-size="21" font-weight="600">1</text></g></svg>
