<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">A substitution keeps the same slot</title><desc id="desc">Example under the limited-substitution rule: starter #7 leaves for substitute #12, then may return only for #12 in the same lineup position. Starter out once and back once per set; substitute enters once. Use the substitution zone between attack-line extensions on the scorer’s side.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><circle cx="165" cy="170" r="19" fill="#c8102e" stroke="white" stroke-width="2"/><text x="165" y="177" text-anchor="middle" fill="white" font-size="21" font-weight="600">7</text><circle cx="475" cy="170" r="19" fill="#234f70" stroke="white" stroke-width="2"/><text x="475" y="177" text-anchor="middle" fill="white" font-size="21" font-weight="600">12</text><line x1="205" y1="150" x2="435" y2="150" stroke="#c8102e" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(435 150) rotate(0)" fill="none" stroke="#c8102e" stroke-width="3"/><line x1="435" y1="195" x2="205" y2="195" stroke="#234f70" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(205 195) rotate(180)" fill="none" stroke="#234f70" stroke-width="3"/><text x="165" y="241" text-anchor="middle" fill="#20231f" font-size="25" font-weight="600">Starter</text><text x="475" y="241" text-anchor="middle" fill="#20231f" font-size="25" font-weight="600">Substitute</text><text x="320" y="310" text-anchor="middle" fill="#20231f" font-size="27" font-weight="600">Same lineup position</text><text x="320" y="365" text-anchor="middle" fill="#5f615a" font-size="23" font-weight="600">7 out → 12 in → 7 returns</text></g></svg>
