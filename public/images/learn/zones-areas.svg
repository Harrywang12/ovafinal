<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Where each zone belongs</title><desc id="desc">Service zones sit beyond the end lines. The substitution zone lies between the attack-line extensions on the scorer’s side; libero replacement zones run from each attack line to its end line on that same side. Blue: back zone. Pale red: front zone. Green: service zone. Gold: libero replacement. Red: substitution. Scorer and benches are outside the free zone.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="80" y="100" width="480" height="240" rx="0" fill="#234f70" stroke="white" stroke-width="2"/><rect x="240" y="100" width="160" height="240" rx="0" fill="#f5d8dd" stroke="none" stroke-width="2"/><line x1="240" y1="100" x2="240" y2="340" stroke="white" stroke-width="2" /><line x1="400" y1="100" x2="400" y2="340" stroke="white" stroke-width="2" /><line x1="320" y1="90" x2="320" y2="350" stroke="#c8102e" stroke-width="5" /><circle cx="320" cy="90" r="5" fill="#c8102e" stroke="none" stroke-width="2"/><circle cx="320" cy="350" r="5" fill="#c8102e" stroke="none" stroke-width="2"/><rect x="32" y="100" width="43" height="240" rx="0" fill="#dbece4" stroke="none" stroke-width="2"/><rect x="565" y="100" width="43" height="240" rx="0" fill="#dbece4" stroke="none" stroke-width="2"/><rect x="240" y="347" width="160" height="24" rx="0" fill="#f2bbc6" stroke="none" stroke-width="2"/><rect x="80" y="347" width="160" height="24" rx="0" fill="#f0deb8" stroke="none" stroke-width="2"/><rect x="400" y="347" width="160" height="24" rx="0" fill="#f0deb8" stroke="none" stroke-width="2"/><text x="160" y="220" text-anchor="middle" fill="white" font-size="22" font-weight="600">Back</text><text x="280" y="220" text-anchor="middle" fill="#20231f" font-size="20" font-weight="600">Front</text><text x="360" y="220" text-anchor="middle" fill="#20231f" font-size="20" font-weight="600">Front</text><text x="480" y="220" text-anchor="middle" fill="white" font-size="22" font-weight="600">Back</text><text x="54" y="79" text-anchor="middle" fill="#176b50" font-size="17" font-weight="600">Serve</text><text x="586" y="79" text-anchor="middle" fill="#176b50" font-size="17" font-weight="600">Serve</text><text x="160" y="397" text-anchor="middle" fill="#20231f" font-size="19" font-weight="600">Bench A</text><text x="320" y="397" text-anchor="middle" fill="#20231f" font-size="19" font-weight="600">Scorer</text><text x="480" y="397" text-anchor="middle" fill="#20231f" font-size="19" font-weight="600">Bench B</text><text x="320" y="56" text-anchor="middle" fill="#c8102e" font-size="18" font-weight="600">NET</text></g></svg>
