<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Transfer toss and lineup information</title><desc id="desc">Teaching extract: team A begins on the scorer’s left and team B on the right. Transfer each team’s service/receive designation and lineup positions I–VI. Example: A serves (S), B receives (R). These are toss outcomes, not permanent team roles. Copy jersey numbers from the signed lineup; Roman numerals identify lineup slots.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="30" y="32" width="580" height="376" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="55" y="68" text-anchor="start" fill="#c8102e" font-size="17" font-weight="600">TEACHING EXTRACT</text><line x1="50" y1="85" x2="590" y2="85" stroke="#d9d6d0" stroke-width="2" /><text x="170" y="124" text-anchor="middle" fill="#c8102e" font-size="24" font-weight="600">A · SERVE (S)</text><text x="470" y="124" text-anchor="middle" fill="#234f70" font-size="24" font-weight="600">B · RECEIVE (R)</text><text x="320" y="177" text-anchor="middle" fill="#5f615a" font-size="18" font-weight="600">LINEUP POSITIONS</text><rect x="60" y="200" width="80" height="50" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="100" y="232" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">I</text><rect x="60" y="250" width="80" height="60" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="100" y="289" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">7</text><rect x="148" y="200" width="80" height="50" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="188" y="232" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">II</text><rect x="148" y="250" width="80" height="60" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="188" y="289" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">12</text><rect x="236" y="200" width="80" height="50" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="276" y="232" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">III</text><rect x="236" y="250" width="80" height="60" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="276" y="289" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">3</text><rect x="324" y="200" width="80" height="50" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="364" y="232" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">IV</text><rect x="324" y="250" width="80" height="60" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="364" y="289" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">8</text><rect x="412" y="200" width="80" height="50" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="452" y="232" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">V</text><rect x="412" y="250" width="80" height="60" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="452" y="289" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">10</text><rect x="500" y="200" width="80" height="50" rx="0" fill="#e7eef3" stroke="#d9d6d0" stroke-width="2"/><text x="540" y="232" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">VI</text><rect x="500" y="250" width="80" height="60" rx="0" fill="white" stroke="#d9d6d0" stroke-width="2"/><text x="540" y="289" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">5</text><text x="320" y="360" text-anchor="middle" fill="#20231f" font-size="20" font-weight="600">Example jersey numbers in slots I–VI</text></g></svg>
