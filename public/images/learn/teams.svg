<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Uniform and roster checks</title><desc id="desc">The captain’s stripe sits below the chest number. The libero wears a clearly contrasting dominant colour; all participants must be registered. Jersey numbers: 1–99 in this VC course. Captain stripe: 8 × 2 cm. Match roster: up to 12 players; apply the course’s VC bench modification.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><path d="M205 95 L235 95 L265 120 L248 147 L240 137 V237 H180 V137 L172 147 L155 120 Z" fill="#c8102e"/><text x="210" y="180" text-anchor="middle" fill="white" font-size="40" font-weight="600">7</text><rect x="193" y="193" width="34" height="8" rx="0" fill="white" stroke="none" stroke-width="2"/><path d="M420 95 L450 95 L480 120 L463 147 L455 137 V237 H395 V137 L387 147 L370 120 Z" fill="#234f70"/><text x="425" y="180" text-anchor="middle" fill="white" font-size="40" font-weight="600">12</text><text x="210" y="287" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">Captain</text><text x="425" y="287" text-anchor="middle" fill="#20231f" font-size="24" font-weight="600">Libero</text><text x="320" y="349" text-anchor="middle" fill="#20231f" font-size="25" font-weight="600">Captain stripe: 8 × 2 cm</text><text x="320" y="392" text-anchor="middle" fill="#5f615a" font-size="20" font-weight="600">Libero: contrasting dominant colour</text></g></svg>
