<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Five line-judge flag signals</title><desc id="desc">Use the flag position together with the described action. The waving signal covers antenna/crossing-space and service-foot faults, as applicable. Down = in. Up = out. Palm on flag top = touched. Wave = relevant fault. Cross forearms at chest = judgment impossible.</desc><rect width="640" height="440" fill="#f8f6f2"/><g font-family="Arial, sans-serif"><rect x="20" y="12" width="192" height="194" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="118" cy="54" r="13" fill="#20231f" stroke="none" stroke-width="2"/><line x1="118" y1="72" x2="118" y2="121" stroke="#20231f" stroke-width="10" /><line x1="118" y1="120" x2="101" y2="155" stroke="#20231f" stroke-width="7" /><line x1="118" y1="120" x2="135" y2="155" stroke="#20231f" stroke-width="7" /><path d="M118 80 L153 121" fill="none" stroke="#20231f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="153" y1="121" x2="153" y2="147" stroke="#20231f" stroke-width="3" /><rect x="153" y="133" width="23" height="15" rx="0" fill="#c8102e" stroke="none" stroke-width="2"/><text x="116" y="174" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">Ball in</text><rect x="224" y="12" width="192" height="194" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="322" cy="54" r="13" fill="#20231f" stroke="none" stroke-width="2"/><line x1="322" y1="72" x2="322" y2="121" stroke="#20231f" stroke-width="10" /><line x1="322" y1="120" x2="305" y2="155" stroke="#20231f" stroke-width="7" /><line x1="322" y1="120" x2="339" y2="155" stroke="#20231f" stroke-width="7" /><path d="M322 80 L354 44" fill="none" stroke="#20231f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="357" y1="40" x2="357" y2="16" stroke="#20231f" stroke-width="3" /><rect x="357" y="16" width="23" height="15" rx="0" fill="#c8102e" stroke="none" stroke-width="2"/><text x="320" y="174" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">Ball out</text><rect x="428" y="12" width="192" height="194" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="526" cy="54" r="13" fill="#20231f" stroke="none" stroke-width="2"/><line x1="526" y1="72" x2="526" y2="121" stroke="#20231f" stroke-width="10" /><line x1="526" y1="120" x2="509" y2="155" stroke="#20231f" stroke-width="7" /><line x1="526" y1="120" x2="543" y2="155" stroke="#20231f" stroke-width="7" /><path d="M526 80 L558 44 M526 80 L536 32 L571 32" fill="none" stroke="#20231f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="561" y1="40" x2="561" y2="16" stroke="#20231f" stroke-width="3" /><rect x="561" y="16" width="23" height="15" rx="0" fill="#c8102e" stroke="none" stroke-width="2"/><text x="524" y="174" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">Ball touched</text><rect x="20" y="222" width="192" height="194" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="118" cy="264" r="13" fill="#20231f" stroke="none" stroke-width="2"/><line x1="118" y1="282" x2="118" y2="331" stroke="#20231f" stroke-width="10" /><line x1="118" y1="330" x2="101" y2="365" stroke="#20231f" stroke-width="7" /><line x1="118" y1="330" x2="135" y2="365" stroke="#20231f" stroke-width="7" /><path d="M118 290 L150 254" fill="none" stroke="#20231f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="153" y1="250" x2="153" y2="226" stroke="#20231f" stroke-width="3" /><rect x="153" y="226" width="23" height="15" rx="0" fill="#c8102e" stroke="none" stroke-width="2"/><line x1="90" y1="249" x2="133" y2="249" stroke="#c8102e" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(133 249) rotate(0)" fill="none" stroke="#c8102e" stroke-width="3"/><line x1="133" y1="232" x2="90" y2="232" stroke="#c8102e" stroke-width="3" /><path d="M-10 -5 L0 0 L-10 5" transform="translate(90 232) rotate(180)" fill="none" stroke="#c8102e" stroke-width="3"/><text x="116" y="384" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">Fault: wave flag</text><rect x="224" y="222" width="192" height="194" rx="8" fill="white" stroke="#d9d6d0" stroke-width="2"/><circle cx="322" cy="264" r="13" fill="#20231f" stroke="none" stroke-width="2"/><line x1="322" y1="282" x2="322" y2="331" stroke="#20231f" stroke-width="10" /><line x1="322" y1="330" x2="305" y2="365" stroke="#20231f" stroke-width="7" /><line x1="322" y1="330" x2="339" y2="365" stroke="#20231f" stroke-width="7" /><path d="M287 278 L350 316 M357 278 L294 316" fill="none" stroke="#20231f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="384" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">Judgment</text><text x="320" y="408" text-anchor="middle" fill="#20231f" font-size="17" font-weight="600">impossible</text></g></svg>
